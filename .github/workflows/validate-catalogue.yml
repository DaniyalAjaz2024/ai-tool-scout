name: Validate Catalogue & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate Schema & Run Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JSON Catalogue & Duplicate Detection
        run: npm run validate

      - name: Run Test Suite (Security, Schema & Integrity)
        run: npm test

      - name: Build Static Production Distribution
        run: npm run build

      - name: Verify Distribution Files
        run: |
          test -f dist/index.html || exit 1
          test -f dist/sitemap.xml || exit 1
          test -f dist/robots.txt || exit 1
          echo "✅ All static pages and assets compiled successfully."
